
---
- name: Configure Web Server Firewall
  hosts: webservers
  become: true
  gather_facts: false

  vars:
    ssh_allowed_ip: "152.58.118.89"

  tasks:
    - name: Install UFW
      apt:
        name: ufw
        state: present
        update_cache: yes

    - name: Set default incoming policy
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Set default outgoing policy
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Allow SSH from current IP only
      community.general.ufw:
        rule: allow
        port: '22'
        proto: tcp
        from_ip: "{{ ssh_allowed_ip }}"

    - name: Allow HTTP
      community.general.ufw:
        rule: allow
        port: '80'
        proto: tcp

    - name: Allow HTTPS
      community.general.ufw:
        rule: allow
        port: '443'
        proto: tcp

    - name: Enable firewall
      community.general.ufw:
        state: enabled
